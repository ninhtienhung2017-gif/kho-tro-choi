<style>
:root{--ink:#244261;--blue:#518de6;--pink:#ff80b2;--gold:#ffc75b;--mint:#a7f0d5;--paper:#fffefa;--shadow:0 14px 30px #6487af27}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',system-ui,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 13% 17%,#fff7b9 0 7%,transparent 8%),radial-gradient(circle at 89% 10%,#f7bfe5 0 8%,transparent 9%),linear-gradient(145deg,#bdefff,#e9f2ff 52%,#fff0d8);min-height:100vh;overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible,.play:focus-visible{outline:4px solid #ff9e00;outline-offset:3px}.wrap{max-width:1100px;margin:auto;padding:17px 20px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:1000;font-size:clamp(19px,3vw,28px)}.pill{background:#fff;border:2px solid #dbe8fb;border-radius:999px;padding:9px 17px;box-shadow:var(--shadow);font-size:16px;font-weight:800}.topright{display:flex;gap:8px;flex-wrap:wrap}.ghost{border:2px solid #aecfec;background:#fff;color:var(--ink);padding:9px 15px;border-radius:20px;font-weight:900}.hero{text-align:center;margin:17px 0 14px}.hero h1{font-size:clamp(27px,4.8vw,45px);line-height:1.15;margin:7px 0}.hero p{font-size:17px;margin:8px 0}.mascot{display:inline-grid;place-items:center;width:83px;height:83px;background:#fff3c7;border:5px solid #fff;border-radius:26px;box-shadow:var(--shadow);font-size:49px;transform:rotate(-6deg)}.layout{display:grid;grid-template-columns:244px 1fr;gap:18px;align-items:start}.sidebar,.main{background:#ffffffde;border:3px solid #fff;border-radius:27px;box-shadow:var(--shadow)}.sidebar{padding:17px}.sidehead{font-size:18px;font-weight:900;margin:0 0 12px}.level{display:flex;align-items:center;gap:9px;width:100%;border:2px solid transparent;border-radius:16px;background:transparent;padding:10px 9px;text-align:left;color:#355174;font-weight:900;margin-bottom:6px;cursor:default}.level .emoji{font-size:24px}.level.active{background:#e7f0ff;border-color:#83b6ff}.level.done{background:#e6fbef;border-color:#abdfbd}.level .tick{margin-left:auto}.progress{height:15px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin:16px 0 6px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#66c8d8,#9bdd7d);transition:width .35s}.muted{color:#637a97;font-size:13px}.main{padding:23px;min-height:515px}.welcome{text-align:center;max-width:630px;margin:auto}.welcome .big{font-size:76px;margin:12px}.welcome h2,.lesson h2{font-size:clamp(23px,3vw,31px);margin:8px 0}.welcome p{font-size:18px;line-height:1.6}.btn{border:0;background:linear-gradient(135deg,#487fdf,#7464db);color:#fff;border-radius:18px;padding:13px 23px;font-size:18px;font-weight:1000;box-shadow:0 6px 0 #3656a2;transition:transform .1s}.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #3656a2}.btn:disabled{background:#acb6c5;box-shadow:0 6px 0 #909ba8;cursor:not-allowed}.btn.secondary{background:linear-gradient(135deg,#ffb653,#fa858e);box-shadow:0 6px 0 #d06b66}.sectiontag{display:inline-block;font-weight:1000;background:#fff0cb;padding:7px 15px;border-radius:999px;color:#91600d}.lesson{text-align:center}.knowledge{background:#e9f4ff;border:2px dashed #8fb8ec;border-radius:20px;padding:13px 18px;margin:14px auto;max-width:660px;font-size:20px;line-height:1.5}.knowledge strong{color:#1766b7}.recall{max-width:670px;margin:13px auto;border:2px solid #efdcf1;border-radius:20px;padding:16px;background:#fff8ff;text-align:left}.recall h3{margin:0 0 10px;font-size:19px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:13px 10px;border:2px solid #ccd8ef;border-radius:14px;background:white;color:var(--ink);text-align:left;font-weight:800}.choice:hover:not(:disabled){background:#eef6ff;border-color:#73a9eb}.choice.good{background:#d8f9e5;border-color:#45b37b}.choice.bad{background:#ffe0e8;border-color:#ed7793}.choice:disabled{cursor:default}.notice{min-height:30px;margin:12px 0 4px;font-size:17px;font-weight:900}.notice.ok{color:#198554}.notice.no{color:#c74b72}.arena{position:relative;min-height:260px;border:3px solid #bad7fa;background:linear-gradient(#eaf9ff,#fef9e8);border-radius:25px;margin:12px 0;overflow:hidden;user-select:none}.hint{margin:8px 0;font-size:18px;font-weight:900}.smallhelp{font-size:14px;color:#56718f;margin:5px 0}.play{position:absolute;border:3px solid #fff;box-shadow:0 8px 13px #5780ab35;border-radius:25px;background:#fff;display:grid;place-items:center;color:var(--ink);touch-action:none}.play .symbol{font-size:52px;line-height:1}.play .label{font-size:15px;font-weight:900}.target{width:112px;height:112px}.play.hit{animation:pop .3s}.basket{position:absolute;right:8%;top:30%;width:145px;height:130px;border:4px dashed #81b5dc;border-radius:26px;background:#d5f6e6;display:grid;place-items:center;font-weight:900;font-size:15px}.basket span{font-size:60px}.drag{position:absolute;left:10%;top:34%;width:110px;height:110px;z-index:2;cursor:grab;background:#fff6dc}.drag:active{cursor:grabbing}.stars{font-size:38px;letter-spacing:7px}.foot{text-align:center;color:#5c7b92;font-size:13px;margin-top:18px}.mouseguide{width:178px;height:220px;margin:12px auto 6px;position:relative}.mousebody{width:135px;height:190px;border:7px solid #5b79bb;border-radius:67px 67px 60px 60px;background:#e9f5ff;position:absolute;left:20px;top:5px;overflow:hidden;box-shadow:inset 0 -12px 0 #bdd1ef}.leftkey,.rightkey{position:absolute;top:0;width:50%;height:78px;background:#fff;border-bottom:6px solid #5b79bb}.leftkey{left:0;border-right:3px solid #5b79bb;border-radius:55px 0 0 0}.rightkey{right:0;border-left:3px solid #5b79bb;border-radius:0 55px 0 0}.mousebody:after{content:'';position:absolute;top:50px;left:calc(50% - 8px);height:33px;width:16px;background:#5b79bb;border-radius:12px}.mousebody.left .leftkey,.mousebody.double .leftkey,.mousebody.dragging .leftkey{background:#ffbd70}.mousebody.right .rightkey{background:#ffbd70}.cursor{position:absolute;bottom:-8px;right:-3px;font-size:43px}.success{padding:17px;border-radius:20px;background:#e6fbea;border:2px solid #8bd8a3;margin:15px 0}.summary{background:#fff8de;border:3px solid #ffe4a4;border-radius:24px;padding:22px;max-width:580px;margin:15px auto}.report{display:flex;justify-content:space-between;gap:8px;padding:9px;border-bottom:1px solid #e1d9b8;font-weight:800}.report:last-child{border:0}.counter{position:absolute;top:12px;left:15px;background:#fff;border-radius:25px;padding:6px 12px;font-weight:900}.spark{position:absolute;pointer-events:none;font-size:32px;animation:rise .8s forwards}.bottomactions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}@keyframes rise{to{transform:translateY(-80px) rotate(25deg);opacity:0}}@keyframes pop{50%{transform:scale(1.16)}}@media(max-width:730px){.layout{grid-template-columns:1fr}.sidebar{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.sidehead{width:100%}.level{width:auto;flex:1 1 140px;font-size:13px;padding:8px}.level .emoji{font-size:19px}.sidebar .progress,.sidebar>.muted{display:none}.main{padding:15px}.choices{grid-template-columns:1fr}.hero{margin:10px 0}.arena{min-height:245px}.basket{right:3%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<body><div class="wrap"><header class="top"><div class="brand">🐭 VƯƠNG QUỐC CHUỘT THẦN KỲ</div><div class="topright"><div class="pill">⭐ Điểm: <span id="score">0</span></div><button class="ghost" id="sound" type="button">🔊 Âm thanh: Bật</button><button class="ghost" id="reset" type="button">↻ Chơi lại</button></div></header><div class="hero"><div class="mascot">🐹</div><h1>Hành trình 5 phép thuật chuột</h1><p>Học thật vui – Nhớ thật lâu – Thao tác thật giỏi! ✨</p></div><div class="layout"><aside class="sidebar"><div class="sidehead">🗺️ Bản đồ thử thách</div><div id="levels"></div><div class="progress"><div id="bar"></div></div><div class="muted" id="progressText">Chưa bắt đầu</div></aside><main class="main" id="main" aria-live="polite"></main></div><div class="foot">Dành cho học sinh lớp 3 • Hoạt động ngoại tuyến • Nên dùng máy tính có chuột trái/phải</div></div>
<script>
'use strict';
const lessons=[
 {name:'Di chuyển chuột',emoji:'🦋',rule:'Di chuyển chuột là <strong>di chuyển con chuột</strong> để đưa con trỏ đến vị trí mong muốn, <strong>không cần bấm nút</strong>.',question:'Để di chuyển con trỏ tới bông hoa, em cần làm gì?',answers:['Di chuyển chuột, không bấm nút','Nháy nút chuột phải','Nháy đúp nút trái','Giữ nút trái rồi kéo'],correct:0,task:'Đưa con trỏ chuột chạm vào 4 chú bướm đang đậu trên hoa.',help:'Chỉ di chuyển chuột, KHÔNG bấm nút.',kind:'move'},
 {name:'Nháy chuột',emoji:'🍎',rule:'Nháy chuột là <strong>nhấn rồi thả nút trái chuột 1 lần</strong>.',question:'Nháy chuột được thực hiện như thế nào?',answers:['Nhấn nút trái 2 lần liên tiếp','Nhấn rồi thả nút trái 1 lần','Nhấn rồi thả nút phải 1 lần','Giữ nút trái và di chuyển'],correct:1,task:'Nháy chuột trái 3 lần để hái 3 quả táo.',help:'Mỗi quả táo chỉ cần MỘT lần nháy nút trái.',kind:'click'},
 {name:'Nháy phải chuột',emoji:'🎁',rule:'Nháy phải chuột là <strong>nhấn rồi thả nút phải chuột 1 lần</strong>.',question:'Muốn nháy phải chuột, em sử dụng nút nào?',answers:['Nút trái, nhấn 1 lần','Nút trái, nhấn 2 lần','Nút phải, nhấn 1 lần','Con lăn chuột'],correct:2,task:'Nháy PHẢI lên 3 hộp quà để mở kho báu.',help:'Đặt con trỏ lên hộp quà rồi nháy nút PHẢI.',kind:'right'},
 {name:'Nháy đúp chuột',emoji:'🚀',rule:'Nháy đúp chuột là <strong>nhấn rồi thả nút trái 2 lần liên tiếp, nhanh</strong>.',question:'Nháy đúp chuột có nghĩa là gì?',answers:['Nháy chuột phải 2 lần','Nháy chuột trái 1 lần','Giữ nút trái rồi kéo','Nháy nút trái 2 lần nhanh'],correct:3,task:'Nháy đúp 3 tên lửa để phóng lên vũ trụ.',help:'Hai lần nháy nút trái nhanh liên tiếp trên cùng một tên lửa.',kind:'double'},
 {name:'Kéo thả chuột',emoji:'🧸',rule:'Kéo thả chuột là <strong>nhấn và giữ nút trái</strong>, di chuyển chuột để kéo đồ vật, sau đó <strong>thả nút trái</strong> tại nơi muốn đặt.',question:'Trình tự nào đúng khi kéo thả chuột?',answers:['Nháy phải → di chuyển → thả','Giữ nút trái → di chuyển → thả','Nháy đúp → di chuyển → thả','Di chuyển → nháy phải → thả'],correct:1,task:'Kéo 3 món đồ chơi vào chiếc giỏ thần kỳ.',help:'GIỮ nút trái trên món đồ → KÉO vào giỏ → THẢ ra.',kind:'drag'}
];
const $=s=>document.querySelector(s);let level=-1,phase='intro',score=0,earned=Array(5).fill(0),done=Array(5).fill(false),attempts=0,step=0,muted=false,working=false,wrongCount=0;const N=3;
function beep(good=true){if(muted)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),gain=a.createGain();o.type='sine';o.frequency.setValueAtTime(good?620:220,a.currentTime);if(good)o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.16);gain.gain.setValueAtTime(.055,a.currentTime);gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.connect(gain).connect(a.destination);o.start();o.stop(a.currentTime+.22);o.onended=()=>a.close()}catch(e){}}
function nav(){ $('#score').textContent=score;$('#bar').style.width=(done.filter(Boolean).length/5*100)+'%';$('#progressText').textContent=`Đã hoàn thành ${done.filter(Boolean).length}/5 thử thách`;$('#levels').innerHTML=lessons.map((l,i)=>`<div class="level ${i===level?'active':''} ${done[i]?'done':''}"><span class="emoji">${l.emoji}</span><span>${i+1}. ${l.name}</span><span class="tick">${done[i]?'✅':i===level?'🎯':'🔒'}</span></div>`).join('')}
function start(){level=0;phase='learn';step=0;wrongCount=0;nav();renderLearn()}
function reset(){level=-1;phase='intro';score=0;earned=Array(5).fill(0);done=Array(5).fill(false);wrongCount=0;nav();intro()}
function intro(){$('#main').innerHTML=`<div class="welcome"><div class="big">🐭🎮🌈</div><h2>Xin chào, nhà thám hiểm nhí!</h2><p>Cùng bạn Chuột Mít khám phá <b>5 phép thuật sử dụng chuột máy tính</b>. Mỗi chặng em sẽ <b>nhớ bí quyết</b>, trả lời câu hỏi, rồi <b>thực hành bằng chuột thật</b> để nhận sao.</p><div class="knowledge">🏆 Mỗi chặng tối đa <strong>50 điểm</strong>: câu hỏi nhớ kiến thức <strong>20 điểm</strong> và thực hành <strong>30 điểm</strong>. Tổng cộng <strong>250 điểm</strong>!</div><p class="smallhelp">💻 Trò chơi tốt nhất trên máy tính có chuột. Nháy phải và kéo thả cần chuột thật.</p><button class="btn" id="start">🚀 Bắt đầu phiêu lưu</button></div>`;$('#start').onclick=start}
function mouseDiagram(kind){let cls=kind==='right'?'right':kind==='double'?'double':kind==='drag'?'dragging':kind==='click'?'left':'';return `<div class="mouseguide" aria-label="Minh họa chuột máy tính"><div class="mousebody ${cls}"><div class="leftkey"></div><div class="rightkey"></div></div><div class="cursor">🖱️</div></div>`}
function renderLearn(){phase='learn';const l=lessons[level];$('#main').innerHTML=`<div class="lesson"><div class="sectiontag">📘 Chặng ${level+1}/5 • Học bí quyết</div><h2>${l.emoji} ${l.name}</h2>${mouseDiagram(l.kind)}<div class="knowledge">💡 ${l.rule}</div><button class="btn" id="remember">🧠 Em đã nhớ – Kiểm tra nào!</button></div>`;$('#remember').onclick=renderQuestion}
function renderQuestion(){phase='question';const l=lessons[level];$('#main').innerHTML=`<div class="lesson"><div class="sectiontag">🧠 Bước 1 • Nhớ kiến thức</div><h2>${l.emoji} ${l.name}</h2><div class="recall"><h3>❓ ${l.question}</h3><div class="choices">${l.answers.map((a,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="notice" id="notice" role="status"></div></div><div class="bottomactions"><button class="ghost" id="review">📖 Xem lại bí quyết</button><button class="btn" id="practice" disabled>🎮 Bắt đầu thực hành</button></div></div>`;$('#review').onclick=renderLearn;$('#practice').onclick=()=>{step=0;renderPractice()};document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const index=+b.dataset.i;if(b.disabled)return;attempts++;if(index===l.correct){b.classList.add('good');if(wrongCount===0){score+=20;earned[level]+=20}beep(true);$('#notice').className='notice ok';$('#notice').textContent=wrongCount===0?'🌟 Chính xác! +20 điểm.':'🌟 Đúng rồi! Em đã nhớ được bí quyết.';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('#practice').disabled=false;nav()}else{wrongCount++;b.classList.add('bad');b.disabled=true;beep(false);$('#notice').className='notice no';$('#notice').textContent='💡 Chưa đúng. Em hãy suy nghĩ rồi chọn lại nhé!'}}))}
function renderPractice(){phase='practice';working=false;const l=lessons[level];$('#main').innerHTML=`<div class="lesson"><div class="sectiontag">🎯 Bước 2 • Thực hành thật</div><h2>${l.emoji} ${l.name}</h2><div class="knowledge">${l.rule}</div><div class="hint">${l.task}</div><div class="smallhelp">💬 ${l.help}</div><div class="arena" id="arena"><div class="counter" id="count">Đã hoàn thành: ${step}/${l.kind==='move'?4:3}</div></div><div class="notice" id="notice" role="status">✨ Sẵn sàng thử sức nào!</div><div class="bottomactions"><button class="ghost" id="backKnowledge">↶ Ôn lại kiến thức</button><button class="btn" id="next" disabled>Tiếp tục ➜</button></div></div>`;$('#backKnowledge').onclick=renderLearn;$('#next').onclick=nextLevel;spawn()}
function showMessage(msg,ok){const n=$('#notice');if(!n)return;n.className='notice '+(ok?'ok':'no');n.textContent=msg}
function spark(x,y){const s=document.createElement('div');s.className='spark';s.textContent='⭐✨';s.style.left=x+'px';s.style.top=y+'px';$('#arena').appendChild(s);setTimeout(()=>s.remove(),850)}
function wrong(msg){if(working)return;showMessage('💡 '+msg,false);beep(false)}
function advance(el){if(working)return;working=true;step++;const max=lessons[level].kind==='move'?4:3;const p=$('#arena');let rect=el.getBoundingClientRect(),ar=p.getBoundingClientRect();spark(rect.left-ar.left+25,rect.top-ar.top+12);el.classList.add('hit');beep(true);showMessage(`🌟 Tuyệt vời! Em đã làm đúng ${step}/${max}.`,true);$('#count').textContent=`Đã hoàn thành: ${step}/${max}`;score+=10;earned[level]+=10;nav();if(step>=max){done[level]=true;nav();setTimeout(()=>finishLevel(),650)}else setTimeout(()=>{working=false;spawn()},600)}
function spawn(){const l=lessons[level],a=$('#arena');a.querySelectorAll('.play,.basket,.instruction').forEach(n=>n.remove());const kind=l.kind;if(kind==='drag'){spawnDrag(a);return}const icons=kind==='move'?['🦋','🐝','🐞','🦄']:kind==='click'?['🍎','🍐','🍓']:kind==='right'?['🎁','🎀','📦']:['🚀','🛸','🛰️'];const el=document.createElement('div');el.className='play target';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',l.name+' '+(step+1));el.innerHTML=`<div class="symbol">${icons[step]}</div><div class="label">${kind==='move'?'Đưa chuột vào đây':kind==='click'?'Nháy trái 1 lần':kind==='right'?'Nháy PHẢI': 'Nháy ĐÚP'}</div>`;let maxX=Math.max(10,a.clientWidth-140),maxY=Math.max(20,a.clientHeight-145);const coords=[[.52,.40],[.08,.39],[.70,.16],[.35,.61]];el.style.left=(13+Math.round(maxX*coords[step][0]))+'px';el.style.top=(25+Math.round(maxY*coords[step][1]))+'px';a.append(el);
if(kind==='move'){el.addEventListener('mouseenter',e=>{if(e.buttons===0)advance(el);else wrong('Hãy thả nút chuột rồi di chuyển nhé!')});el.addEventListener('click',()=>wrong('Chỉ DI CHUYỂN chuột, không cần nháy.'))}
if(kind==='click'){let clicks=0;el.addEventListener('click',e=>{if(e.detail>=2){wrong('Em vừa nháy nhiều lần; hãy nháy một lần vào quả tiếp theo.');return}advance(el)});el.addEventListener('contextmenu',e=>{e.preventDefault();wrong('Đây là nháy phải. Hãy dùng nút TRÁI 1 lần.')})}
if(kind==='right'){el.addEventListener('contextmenu',e=>{e.preventDefault();advance(el)});el.addEventListener('click',()=>wrong('Em vừa nháy trái. Hãy dùng nút PHẢI.'))}
if(kind==='double'){el.addEventListener('dblclick',()=>advance(el));el.addEventListener('contextmenu',e=>{e.preventDefault();wrong('Nháy đúp phải dùng nút TRÁI 2 lần nhanh.')});el.addEventListener('click',e=>{if(e.detail===1)showMessage('⏱️ Một lần rồi! Nháy tiếp thật nhanh vào tên lửa nhé.',false)})}
}
function spawnDrag(a){const toys=['🧸','⚽','🚗'];let basket=document.createElement('div');basket.className='basket';basket.innerHTML='<span>🧺</span>THẢ VÀO GIỎ';a.append(basket);let el=document.createElement('div');el.className='play drag';el.innerHTML=`<div class="symbol">${toys[step]}</div><div class="label">Giữ và kéo</div>`;a.append(el);let active=null;el.addEventListener('pointerdown',e=>{if(e.button!==0){wrong('Kéo thả cần dùng nút TRÁI.');return}e.preventDefault();active={id:e.pointerId,startX:e.clientX,startY:e.clientY,left:el.offsetLeft,top:el.offsetTop};el.setPointerCapture(e.pointerId);el.style.cursor='grabbing'});el.addEventListener('pointermove',e=>{if(!active||e.pointerId!==active.id)return;const x=Math.max(0,Math.min(a.clientWidth-el.offsetWidth,active.left+e.clientX-active.startX));const y=Math.max(0,Math.min(a.clientHeight-el.offsetHeight,active.top+e.clientY-active.startY));el.style.left=x+'px';el.style.top=y+'px'});el.addEventListener('pointerup',e=>{if(!active||e.pointerId!==active.id)return;active=null;el.style.cursor='grab';const r=el.getBoundingClientRect(),b=basket.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;if(cx>b.left&&cx<b.right&&cy>b.top&&cy<b.bottom){advance(el)}else{wrong('Em cần giữ nút trái, kéo đồ vào giỏ rồi thả. Thử lại nhé!');el.style.left='10%';el.style.top='34%'}});el.addEventListener('pointercancel',()=>{active=null;el.style.left='10%';el.style.top='34%'});a.addEventListener('contextmenu',e=>e.preventDefault(),{once:true})}
function finishLevel(){phase='complete';const l=lessons[level];$('#main').innerHTML=`<div class="welcome"><div class="big">🎉${l.emoji}🎉</div><h2>Hoàn thành chặng ${level+1}!</h2><div class="success">🌟 Em đã biết cách <b>${l.name.toLowerCase()}</b> và thực hành thành công!<br>Điểm chặng này: <b>${earned[level]}/50</b></div><div class="knowledge">🧠 Ghi nhớ: ${l.rule}</div><div class="stars">⭐⭐⭐</div><div class="bottomactions"><button class="btn" id="next">${level===4?'🏆 Xem tổng kết':'➡️ Sang thử thách tiếp theo'}</button></div></div>`;$('#next').onclick=nextLevel}
function nextLevel(){if(level===4){summary();return}level++;wrongCount=0;step=0;nav();renderLearn()}
function summary(){level=5;nav();const rank=score>=230?'🏆 BẬC THẦY CHUỘT':score>=180?'🥇 CAO THỦ CHUỘT':score>=120?'🥈 NHÀ THÁM HIỂM GIỎI':'🌱 NHÀ THÁM HIỂM KIÊN TRÌ';$('#main').innerHTML=`<div class="welcome"><div class="big">🏆🎊🐭</div><h2>Chúc mừng em đã về đích!</h2><div class="summary"><div class="sectiontag">${rank}</div><h2>⭐ ${score} / 250 điểm</h2>${lessons.map((l,i)=>`<div class="report"><span>${l.emoji} ${l.name}</span><span>${earned[i]}/50 ⭐</span></div>`).join('')}</div><p>Em đã được học, ghi nhớ và thực hành đủ <b>5 thao tác chuột</b> rồi!</p><button class="btn" id="again">🔄 Chơi lại để chinh phục 250 điểm</button></div>`;$('#again').onclick=reset}
$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇 Âm thanh: Tắt':'🔊 Âm thanh: Bật';if(!muted)beep(true)};$('#reset').onclick=()=>{reset()};nav();intro();
</script></body></html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hành Trình Giải Cứu Vương Quốc Bàn Phím - Tin Học Lớp 3</title>
  <style>
    /* =====================================================================
       1. RESET & NỀN TỔNG THỂ (CHẠY 100% NGOẠI TUYẾN - KHÔNG CẦN CDN)
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #dff4ff 0%, #f3e8ff 50%, #fef3c7 100%);
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      border: none;
      outline: none;
    }

    svg {
      display: block;
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================================
       2. KHUNG SÂN KHẤU 16:9 TỐI ƯU CHO 1366x768 & 1920x1080
       ===================================================================== */
    .game-stage {
      width: 100%;
      max-width: 1200px;
      height: min(calc(100vh - 20px), 680px);
      min-height: 540px;
      background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 55%, #fdf4ff 100%);
      border: 5px solid #ffffff;
      border-radius: 26px;
      box-shadow: 0 18px 45px rgba(59, 130, 246, 0.18), 0 8px 18px rgba(139, 92, 246, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 960px) {
      body { padding: 6px; }
      .game-stage {
        height: auto;
        min-height: calc(100vh - 12px);
        border-radius: 18px;
      }
    }

    /* Đám mây trang trí nền */
    .bg-decor {
      pointer-events: none;
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0.45;
      z-index: 0;
    }
    .bg-blob-1 {
      position: absolute; top: -40px; left: -40px;
      width: 210px; height: 210px; border-radius: 50%;
      background: #bae6fd; filter: blur(36px);
    }
    .bg-blob-2 {
      position: absolute; top: 40px; right: 30px;
      width: 250px; height: 250px; border-radius: 50%;
      background: #e9d5ff; filter: blur(42px);
    }
    .bg-blob-3 {
      position: absolute; bottom: 0; left: 33%;
      width: 280px; height: 160px; border-radius: 50%;
      background: #fef3c7; filter: blur(36px);
    }

    /* =====================================================================
       3. HEADER (THANH ĐIỀU KHIỂN, 6 PHA LÊ, ĐIỂM SỐ)
       ===================================================================== */
    .game-header {
      position: relative;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 2px solid #e0f2fe;
      flex-shrink: 0;
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eef2ff;
      padding: 5px 12px;
      border-radius: 16px;
      border: 2px solid #e0e7ff;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 800;
      color: #4338ca;
    }

    .crystal-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .crystal-slot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #cbd5e1;
      background: #e2e8f0;
      opacity: 0.55;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s ease;
    }
    .crystal-slot:hover { transform: scale(1.12); }
    .crystal-slot.earned {
      background: #ffffff;
      border-color: #fcd34d;
      opacity: 1;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.25);
    }
    .crystal-svg {
      width: 20px;
      height: 20px;
    }

    .progress-divider {
      width: 2px;
      height: 20px;
      background: #c7d2fe;
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 900;
      color: #312e81;
      font-size: 15px;
    }
    .score-max {
      font-size: 12px;
      color: #6366f1;
      font-weight: 700;
    }

    /* =====================================================================
       4. KHU VỰC NỘI DUNG CHÍNH (MAIN)
       ===================================================================== */
    .game-main {
      position: relative;
      z-index: 10;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 18px;
      overflow-y: auto;
    }

    /* =====================================================================
       5. FOOTER - ROBOT HƯỚNG DẪN Ở GÓC DƯỚI TRÁI (KHÔNG TRÀN, KHÔNG CHE)
       ===================================================================== */
    .robot-footer {
      position: relative;
      z-index: 20;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.9);
      border-top: 2px solid #e0f2fe;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .robot-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .robot-avatar {
      width: 58px;
      height: 58px;
      min-width: 58px;
      min-height: 58px;
      max-width: 58px;
      max-height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .robot-avatar svg {
      width: 58px;
      height: 58px;
      filter: drop-shadow(0 3px 4px rgba(15, 23, 42, 0.14));
    }

    .robot-bubble {
      background: #f0f9ff;
      border: 2px solid #bae6fd;
      border-radius: 16px;
      padding: 7px 14px;
      flex: 1;
      min-width: 0;
    }

    .robot-bubble-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .robot-name {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #0284c7;
    }

    .robot-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 999px;
    }
    .robot-badge.happy { background: #d1fae5; color: #047857; }
    .robot-badge.hint  { background: #fef3c7; color: #92400e; }

    .robot-speech {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.35;
    }

    .footer-action {
      flex-shrink: 0;
    }

    /* =====================================================================
       6. NÚT BẤM HOẠT HÌNH 3D & BẢNG MÀU
       ===================================================================== */
    .btn-game {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    }
    .btn-game:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
    }
    .btn-game:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }
    .btn-game:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-md { padding: 9px 18px; font-size: 14px; }
    .btn-lg { padding: 11px 26px; font-size: 16px; border-radius: 16px; }

    .btn-sky     { background: #0ea5e9; color: #ffffff; }
    .btn-amber   { background: #fbbf24; color: #451a03; }
    .btn-yellow  { background: #fde047; color: #422006; }
    .btn-emerald { background: #34d399; color: #064e3b; }
    .btn-green   { background: #10b981; color: #ffffff; }
    .btn-rose    { background: #fb7185; color: #ffffff; }
    .btn-rose-dk { background: #f43f5e; color: #ffffff; }
    .btn-slate   { background: #e2e8f0; color: #334155; }
    .btn-grad-blue   { background: linear-gradient(90deg, #0ea5e9, #4f46e5); color: #ffffff; }
    .btn-grad-orange { background: linear-gradient(90deg, #fbbf24, #f97316); color: #ffffff; }
    .btn-grad-purple { background: linear-gradient(90deg, #6366f1, #a855f7); color: #ffffff; }

    /* =====================================================================
       7. PHÍM BÀN PHÍM ẢO, GỜ NỔI F/J, MÀU 10 NGÓN TAY THỐNG NHẤT
       ===================================================================== */
    .kb-key {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      border-bottom-width: 4px;
      background: #ffffff;
      font-weight: 800;
      color: #334155;
      transition: all 0.14s ease;
      position: relative;
      line-height: 1;
      flex-shrink: 0;
    }
    .kb-key.clickable:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background-color: #e0f2fe;
      cursor: pointer;
    }
    .kb-key.active-press {
      transform: translateY(3px);
      border-bottom-width: 2px;
      filter: brightness(0.93);
    }
    .kb-key.target-pulse {
      animation: keyPulse 1s infinite;
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.38);
      z-index: 5;
    }
    .kb-key.correct-key {
      background: #bbf7d0 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
    }
    .kb-key.wrong-key {
      background: #fecaca !important;
      border-color: #ef4444 !important;
      animation: shake 0.35s ease;
    }

    /* Gờ nổi trên phím F và J */
    .bump-bar {
      position: absolute;
      bottom: 3px;
      width: 48%;
      height: 3.5px;
      background: #0f172a;
      border-radius: 99px;
      opacity: 0.78;
    }

    /* Màu 10 ngón tay thống nhất toàn bộ trò chơi */
    .f-l-pinky  { background-color: #fbcfe8; border-color: #ec4899; color: #831843; }
    .f-l-ring   { background-color: #fed7aa; border-color: #f97316; color: #7c2d12; }
    .f-l-middle { background-color: #fef08a; border-color: #eab308; color: #713f12; }
    .f-l-index  { background-color: #bbf7d0; border-color: #22c55e; color: #14532d; }
    .f-thumb    { background-color: #e2e8f0; border-color: #64748b; color: #1e293b; }
    .f-r-index  { background-color: #bae6fd; border-color: #0ea5e9; color: #0c4a6e; }
    .f-r-middle { background-color: #c7d2fe; border-color: #6366f1; color: #312e81; }
    .f-r-ring   { background-color: #e9d5ff; border-color: #a855f7; color: #581c87; }
    .f-r-pinky  { background-color: #fecdd3; border-color: #f43f5e; color: #881337; }

    /* =====================================================================
       8. BỐ CỤC CHUNG CHO CÁC MÀN CHƠI
       ===================================================================== */
    .screen-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      gap: 8px;
      width: 100%;
    }

    .screen-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      width: 100%;
    }

    .mission-head {
      text-align: center;
    }

    .mission-pill {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .pill-sky     { background: #e0f2fe; color: #0369a1; }
    .pill-purple  { background: #f3e8ff; color: #7e22ce; }
    .pill-emerald { background: #d1fae5; color: #047857; }
    .pill-amber   { background: #fef3c7; color: #92400e; }
    .pill-pink    { background: #fce7f3; color: #be185d; }
    .pill-rose    { background: #ffe4e6; color: #be123c; }

    .mission-title {
      margin: 4px 0 0 0;
      font-size: 20px;
      font-weight: 900;
      color: #1e293b;
      line-height: 1.25;
    }

    /* =====================================================================
       9. TRANG CHỦ (HOME)
       ===================================================================== */
    .home-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 999px;
      background: #fef3c7;
      border: 2px solid #fcd34d;
      color: #92400e;
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .home-title {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.2;
      color: #0369a1;
      background: linear-gradient(90deg, #0284c7, #4f46e5, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-sub {
      margin: 6px 0 0 0;
      color: #475569;
      font-weight: 700;
      font-size: 14px;
    }

    .missions-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 920px;
    }
    @media (max-width: 780px) {
      .missions-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .mission-card {
      text-align: left;
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid #bae6fd;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
    }
    .mission-card.done {
      background: #ecfdf5;
      border-color: #6ee7b7;
    }
    .mission-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }
    .mission-icon { font-size: 26px; line-height: 1; }
    .tag-row { display: flex; align-items: center; gap: 4px; }
    .tag-done {
      font-size: 11px; font-weight: 900; padding: 2px 7px;
      border-radius: 999px; background: #10b981; color: #ffffff;
    }
    .tag-pts {
      font-size: 11px; font-weight: 900; padding: 2px 7px;
      border-radius: 999px; background: #e0e7ff; color: #4338ca;
    }
    .mission-card-name {
      margin-top: 6px;
      font-weight: 900;
      color: #1e293b;
      font-size: 14px;
      line-height: 1.3;
    }
    .mission-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
    }
    .badge-self {
      font-size: 11px;
      font-weight: 900;
      color: #d97706;
    }

    .home-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    /* =====================================================================
       10. NHIỆM VỤ 1: BÀN PHÍM 4 KHU VỰC (HÌNH 31 SGK)
       ===================================================================== */
    .full-kb-board {
      width: 100%;
      max-width: 1020px;
      background: #f1f5f9;
      border: 4px solid #cbd5e1;
      border-radius: 22px;
      padding: 12px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .kb-zone {
      border: 3px dashed transparent;
      border-radius: 14px;
      padding: 7px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      background: rgba(255, 255, 255, 0.85);
    }
    .kb-zone:hover {
      background: rgba(56, 189, 248, 0.14);
      border-color: #38bdf8;
      transform: scale(1.01);
    }
    .kb-zone.zone-correct {
      background: rgba(34, 197, 94, 0.18) !important;
      border: 3px solid #22c55e !important;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.3);
    }
    .kb-zone.zone-wrong {
      background: rgba(239, 68, 68, 0.14) !important;
      border-color: #ef4444 !important;
      animation: shake 0.35s ease;
    }

    .zone-num {
      position: absolute;
      top: -10px;
      left: -8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 4;
    }
    .zn-1 { background: #f43f5e; }
    .zn-2 { background: #0ea5e9; }
    .zn-3 { background: #f59e0b; }
    .zn-4 { background: #a855f7; }

    .m1-top-row {
      display: grid;
      grid-template-columns: 9fr 3fr;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .m1-body-row {
      display: grid;
      grid-template-columns: 7.2fr 2.1fr 2.7fr;
      gap: 10px;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      .m1-top-row { grid-template-columns: 1fr; }
      .m1-body-row { grid-template-columns: 1fr; }
    }

    .m1-fn-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: space-between;
      padding-left: 16px;
    }
    .m1-fn-keys .kb-key {
      padding: 5px 8px;
      font-size: 11px;
      background: #fff1f2;
    }

    .m1-leds {
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
    }

    .m1-main-rows {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .m1-main-line {
      display: flex;
      gap: 3px;
      justify-content: center;
    }
    .m1-k-std   { width: 32px; height: 30px; font-size: 11px; }
    .m1-k-wide  { padding: 0 7px; height: 30px; font-size: 10px; }
    .m1-k-space { flex: 1; height: 30px; font-size: 10px; }

    .m1-nav-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
    }
    .m1-nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .m1-nav-grid .kb-key { height: 28px; font-size: 10px; background: #fffbeb; }

    .m1-num-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .m1-num-grid .kb-key { height: 29px; font-size: 11px; background: #faf5ff; }

    .note-chip {
      padding: 5px 12px;
      background: #ffffff;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    /* =====================================================================
       11. NHIỆM VỤ 2: KÉO THẢ 5 HÀNG PHÍM
       ===================================================================== */
    .m2-layout {
      display: grid;
      grid-template-columns: 4fr 8fr;
      gap: 12px;
      width: 100%;
      max-width: 1020px;
      align-items: center;
    }
    @media (max-width: 860px) {
      .m2-layout { grid-template-columns: 1fr; }
    }

    .m2-cards-box {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #e9d5ff;
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .m2-cards-title {
      font-size: 11px;
      font-weight: 900;
      color: #7e22ce;
      text-transform: uppercase;
      text-align: center;
    }
    .m2-cards-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .m2-card {
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
    }
    .m2-card.locked {
      opacity: 0.35;
      text-decoration: line-through;
      pointer-events: none;
    }
    .selected-ring {
      box-shadow: 0 0 0 4px #facc15 !important;
    }

    .m2-rows-board {
      background: #f1f5f9;
      border: 4px solid #cbd5e1;
      border-radius: 22px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .m2-row-drop {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 14px;
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .m2-row-drop.placed-num    { background: #ffe4e6; border: 2px solid #fb7185; }

    /* =====================================================================
       12. BÀN PHÍM CHÍNH TƯƠNG TÁC (NV3, NV5, NV6) & ĐÔI BÀN TAY SVG

    /* Nút chọn ngón tay (NV4 & NV6) */

    /* Chuỗi gõ phím (NV5 & NV6) */

       14. KHO BÁU & MODAL
       ===================================================================== */

      display: flex;
      justify-content: center;
      gap: 10px;
    }

      width: 44px;

       15. KÉO THẢ POINTER & HOẠT ẢNH

    .drag-item {
      touch-action: none;
      cursor: grab;
    }
    .drag-item:active { cursor: grabbing; }
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.24);
      opacity: 0.95;

      outline: 3px dashed #0284c7 !important;
      background-color: #e0f2fe !important;
      transform: scale(1.02);
    }

    @keyframes robotFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes robotJump {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-16px) scale(1.06); }
      50% { transform: translateY(0) scale(0.96); }
      75% { transform: translateY(-10px) scale(1.03); }
    }
    @keyframes armWave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes keyPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }

      0% { transform: scale(0.2) rotate(-25deg); opacity: 0; }

    }
    @keyframes fingerDemoDown {
      0%, 100% { transform: translateY(0); }
      35%, 65% { transform: translateY(38px); }
    }

    .robot-idle { animation: robotFloat 3s ease-in-out infinite; }
    .robot-jump { animation: robotJump 0.75s ease-in-out; }
    .robot-arm-right { transform-origin: 85px 66px; animation: armWave 2.2s ease-in-out infinite; }
    .crystal-earned { animation: crystalPop 0.6s ease-out forwards; }
    .demo-return-up { animation: fingerDemoUp 2.2s ease-in-out infinite; }
    .demo-return-down { animation: fingerDemoDown 2.2s ease-in-out infinite; }

    /* Pháo giấy Canvas */
    #confettiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;

  </style>
</head>
<body>

  <!-- KHUNG TRÒ CHƠI CHÍNH (TỈ LỆ 16:9, GỌN TRONG MÀN HÌNH 1366x768 & 1920x1080) -->
  <div id="gameStage" class="game-stage">

  <!-- TOÀN BỘ LOGIC TRÒ CHƠI (CHẠY NGOẠI TUYẾN HOÀN TOÀN) -->
  <script>
    /*************************************************************************
     * 1. HỆ THỐNG ÂM THANH (WEB AUDIO API - KHÔNG CẦN FILE NGOÀI)
     *************************************************************************/
    const SoundFX = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, duration = 0.14, type = 'sine', volume = 0.14, delay = 0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.001, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(volume, this.ctx.currentTime + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration + 0.02);
        } catch (e) { /* Bỏ qua nếu trình duyệt hạn chế âm thanh */ }
      },
      click() { this.playTone(520, 0.07, 'triangle', 0.1); },
      keyTap() { this.playTone(680, 0.06, 'sine', 0.1); },
      correct() {
        this.playTone(523.25, 0.12, 'triangle', 0.15, 0);
        this.playTone(659.25, 0.12, 'triangle', 0.15, 0.09);

    /*************************************************************************
     * 4. HỆ THỐNG KÉO THẢ ĐA NỀN TẢNG (CHUỘT + CẢM ỨNG)
     *************************************************************************/
    function makeDraggable(el, payload, onDropCallback) {
      el.classList.add('drag-item');
      el.addEventListener('pointerdown', (e) => {
        if (el.dataset.locked === 'true') return;
        e.preventDefault();
        SoundFX.click();

        const ghost = el.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.style.width = el.offsetWidth + 'px';
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
        document.body.appendChild(ghost);
        el.style.opacity = '0.35';

        let currentHover = null;

        const onMove = (ev) => {
          ghost.style.left = ev.clientX + 'px';
          ghost.style.top = ev.clientY + 'px';
          ghost.style.display = 'none';
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          ghost.style.display = '';
          const dz = under ? under.closest('[data-dropzone]') : null;

          if (currentHover && currentHover !== dz) {
            currentHover.classList.remove('drop-zone-hover');
          }
          if (dz) {
            dz.classList.add('drop-zone-hover');
          }
          currentHover = dz;
        };

        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          ghost.remove();
          el.style.opacity = '1';
          if (currentHover) {
            currentHover.classList.remove('drop-zone-hover');
            onDropCallback(payload, currentHover.dataset.dropzone, currentHover, el);
          }
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });
    }

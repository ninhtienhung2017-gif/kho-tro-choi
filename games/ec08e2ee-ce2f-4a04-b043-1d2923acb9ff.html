              </div>

              <!-- KHU VỰC 3: PHÍM ĐIỀU HƯỚNG -->
              <div id="zone3" data-zone="3" class="kb-zone m1-nav-col">
                <span class="zone-num zn-3">3</span>
                <div class="m1-nav-grid">
                  ${['Ins','Hm','PU','Del','End','PD'].map(k => `<div class="kb-key">${k}</div>`).join('')}
                </div>
                <div class="m1-nav-grid">
                  <div></div><div class="kb-key">↑</div><div></div>
                  <div class="kb-key">←</div><div class="kb-key">↓</div><div class="kb-key">→</div>
                </div>
              </div>

              <!-- KHU VỰC 4: BÀN PHÍM SỐ -->
              <div id="zone4" data-zone="4" class="kb-zone">
                <span class="zone-num zn-4">4</span>
                <div class="m1-num-grid">
                  ${['Num','/','*','-','7','8','9','+','4','5','6','+','1','2','3','↵','0','0','.','↵'].map(k =>
                    `<div class="kb-key">${k}</div>`
                  ).join('')}
                </div>
              </div>
            </div>
          </div>

          <div class="note-chip">Hãy nháy trực tiếp vào 1 trong 4 khung đánh số trên bàn phím!</div>
        </div>
      `;

      main.querySelectorAll('.kb-zone').forEach(z => {
        z.addEventListener('click', () => {
          const id = z.dataset.zone;
          main.querySelectorAll('.kb-zone').forEach(el => el.classList.remove('zone-wrong'));
          if (id === '2') {
            z.classList.add('zone-correct');
            awardMission(1);
            setRobotSpeech('🎉 Chính xác rồi! Khu vực số 2 là <b>Khu vực chính của bàn phím</b>! Em nhận được <b>10 điểm</b> và Viên Pha lê Xanh Dương!', 'happy');
            setFooterAction(`
              <button onclick="SoundFX.click(); goToScreen('m2')" class="btn-game btn-md btn-green">
                Nhiệm vụ 2 ➜
              </button>
            `);
          } else {
            z.classList.add('zone-wrong');
            SoundFX.wrong();
            setRobotSpeech('Chưa đúng rồi! Em hãy tìm khu vực có <b>nhiều phím chữ cái</b> nhất nhé!', 'hint');
          }
        });
      });

      if (GameState.completed[1]) {
        document.getElementById('zone2').classList.add('zone-correct');
        setFooterAction(`
          <button onclick="SoundFX.click(); goToScreen('m2')" class="btn-game btn-md btn-green">
            Nhiệm vụ 2 ➜
          </button>
        `);
      }
    }

    /*************************************************************************
     * 8. NHIỆM VỤ 2: TRUY TÌM HÀNG PHÍM (10 ĐIỂM)
     *************************************************************************/
    function renderMission2() {
      GameState.currentHintText = 'Hàng phím số có 1, 2, 3...; Hàng trên có Q, W, E...; Hàng cơ sở có A, S, D, F, J...; Hàng dưới có Z, X, C...; Hàng cuối chứa phím Dấu cách (Space)!';
      setRobotSpeech('Em hãy <b>kéo thả 5 thẻ tên</b> vào đúng các hàng phím trên khu vực chính nhé! (Hoặc nháy thẻ rồi nháy vào hàng cần đặt)', 'normal');

      const rowsData = [
        { id: 'num',    label: 'Hàng phím số',                 keys: ['1','2','3','4','5','6','7','8','9','0','-','='] },
        { id: 'top',    label: 'Hàng phím trên',               keys: ['Q','W','E','R','T','Y','U','I','O','P','[',']'] },
        { id: 'home',   label: 'Hàng phím cơ sở',              keys: ['A','S','D','F','G','H','J','K','L',';','\''] },
        { id: 'bottom', label: 'Hàng phím dưới',               keys: ['Z','X','C','V','B','N','M',',','.','/'] },
        { id: 'space',  label: 'Hàng phím chứa phím dấu cách', keys: ['Ctrl','Alt','Phím dấu cách (Space)','Alt','Ctrl'] }
      ];

      const shuffled = [rowsData[2], rowsData[0], rowsData[4], rowsData[1], rowsData[3]];
      const placed = {};
      let selectedCardId = null;

      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="screen-col">
          <div class="mission-head">
            <span class="mission-pill pill-purple">NHIỆM VỤ 2 • NHẬN BIẾT • 10 ĐIỂM</span>
            <h2 class="mission-title">🧩 Truy tìm tên 5 hàng phím</h2>
          </div>

          <div class="m2-layout">
            <div class="m2-cards-box">
              <div class="m2-cards-title">Kéo các thẻ tên này sang phải ➔</div>
              <div id="m2Cards" class="m2-cards-list">
                ${shuffled.map(r => `
                  <div id="card-${r.id}" data-card-id="${r.id}" class="btn-game btn-grad-purple m2-card">
                    🏷️ ${r.label}
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="m2-rows-board">
              ${rowsData.map(r => `
                <div id="rowWrap-${r.id}" data-dropzone="${r.id}" class="m2-row-drop">
                  <div id="slot-${r.id}" class="m2-slot">Thả tên vào đây</div>
                  <div class="m2-keys-line">
                    ${r.keys.map(k => `
                      <div class="kb-key ${k.includes('Space') ? 'is-space' : ''}">
                        ${k}
                        ${(k === 'F' || k === 'J') ? '<span class="bump-bar"></span>' : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div></div>
        </div>
      `;

      function handlePlacement(cardId, targetRowId) {
        if (placed[targetRowId]) return;
        const rowInfo = rowsData.find(r => r.id === targetRowId);
        const cardEl = document.getElementById(`card-${cardId}`);

        if (cardId === targetRowId) {
          placed[targetRowId] = true;
          SoundFX.correct();

          const rowWrap = document.getElementById(`rowWrap-${targetRowId}`);
          rowWrap.classList.add('placed-' + targetRowId);
          const slot = document.getElementById(`slot-${targetRowId}`);
          slot.classList.add('filled');
          slot.textContent = '✓ ' + rowInfo.label;

          cardEl.dataset.locked = 'true';
          cardEl.classList.add('locked');
          cardEl.classList.remove('selected-ring');
          selectedCardId = null;

          const doneCount = Object.keys(placed).length;
          if (doneCount === 5) {
            awardMission(2);
            setRobotSpeech('🎉 Xuất sắc! Em đã nhận diện đúng cả 5 hàng phím! Nhận <b>10 điểm</b> và Viên Pha lê Tím nhé!', 'happy');
            setFooterAction(`
              <button onclick="SoundFX.click(); goToScreen('m3')" class="btn-game btn-md btn-green">
                Nhiệm vụ 3 ➜
              </button>
            `);
          } else {
            setRobotSpeech(`Đúng rồi! Đó chính là <b>${rowInfo.label}</b>. Còn ${5 - doneCount} hàng nữa thôi!`, 'happy');
          }
        } else {
          SoundFX.wrong();
          const rowWrap = document.getElementById(`rowWrap-${targetRowId}`);
          rowWrap.classList.add('zone-wrong');
          setTimeout(() => rowWrap.classList.remove('zone-wrong'), 400);
          setRobotSpeech('Ồ, chưa khớp rồi! Em hãy quan sát kỹ các chữ cái hoặc con số trên hàng phím đó nhé!', 'hint');
        }
      }

      shuffled.forEach(r => {
        const cardEl = document.getElementById(`card-${r.id}`);
        makeDraggable(cardEl, r.id, (cardId, zoneId) => handlePlacement(cardId, zoneId));
        cardEl.addEventListener('click', () => {
          if (cardEl.dataset.locked === 'true') return;
          SoundFX.click();
          document.querySelectorAll('#m2Cards > div').forEach(c => c.classList.remove('selected-ring'));
          selectedCardId = r.id;
          cardEl.classList.add('selected-ring');
        });
      });

      rowsData.forEach(r => {
        const rowWrap = document.getElementById(`rowWrap-${r.id}`);
        rowWrap.addEventListener('click', () => {
          if (selectedCardId) handlePlacement(selectedCardId, r.id);
        });
      });
    }

    /*************************************************************************
     * 9. NHIỆM VỤ 3: BÍ MẬT HAI PHÍM CÓ GỜ (15 ĐIỂM - 3 BƯỚC)
     *************************************************************************/
    function renderMission3() {
      let step = 1;
      let foundF = false;
      let foundJ = false;
      let placedLeftIndex = false;
      let placedRightIndex = false;
      let selectedToken = null;

      function renderStep() {
        const main = document.getElementById('mainContent');

        if (step === 1) {
          GameState.currentHintText = 'Em hãy quan sát kỹ hàng phím cơ sở (A S D F G H J K L ;). Có hai phím có vạch gờ nhỏ ở phía dưới!';
          setRobotSpeech('Bước 1/3: Robot bị mất vị trí đặt hai ngón trỏ! Em hãy <b>nháy chuột vào 2 phím có gờ</b> trên bàn phím nhé!', 'normal');
          main.innerHTML = `
            <div class="screen-col">
              <div class="mission-head">
                <span class="mission-pill pill-emerald">NHIỆM VỤ 3 • BƯỚC 1/3 • 15 ĐIỂM</span>
                <h2 class="mission-title">✨ Tìm hai phím có gờ trên hàng cơ sở</h2>
              </div>

              <div class="status-pair">
                <div class="status-chip ${foundF ? 'found' : ''}">Phím có gờ 1: ${foundF ? 'F ✓' : '?'}</div>
                <div class="status-chip ${foundJ ? 'found' : ''}">Phím có gờ 2: ${foundJ ? 'J ✓' : '?'}</div>
              </div>

              ${renderInteractiveMainKeyboard({ showBumps: true, highlightKeys: [foundF ? 'F' : '', foundJ ? 'J' : ''] })}
            </div>
          `;

          main.querySelectorAll('[data-key]').forEach(kEl => {
            kEl.classList.add('clickable');
            kEl.addEventListener('click', () => {
              const key = kEl.dataset.key;
              if (key === 'F' || key === 'J') {
                if (key === 'F') foundF = true;
                if (key === 'J') foundJ = true;
                SoundFX.correct();
                if (foundF && foundJ) {
                  setRobotSpeech('Giỏi quá! Chính là hai phím <b>F</b> và <b>J</b> có gờ nổi! Cùng sang Bước 2 nhé!', 'happy');
                  setTimeout(() => { step = 2; renderStep(); }, 950);
                } else {
                  setRobotSpeech(`Đúng rồi! Em đã tìm thấy phím <b>${key}</b>. Hãy tìm thêm phím có gờ còn lại nhé!`, 'happy');
                  renderStep();
                }
              } else {
                SoundFX.wrong();
                kEl.classList.add('wrong-key');
                setTimeout(() => kEl.classList.remove('wrong-key'), 400);
                setRobotSpeech('Phím này không có gờ! Em hãy nhìn kỹ hàng phím cơ sở (chứa A, S, D, F, G, H, J...) nhé!', 'hint');
              }
            });
          });
        } else if (step === 2) {
          GameState.currentHintText = 'Ngón trỏ tay trái (màu xanh lá) đặt lên phím F. Ngón trỏ tay phải (màu xanh dương) đặt lên phím J. Không đặt nhầm vào G hay H nhé!';
          setRobotSpeech('Bước 2/3: Em hãy <b>kéo Ngón trỏ trái đến phím F</b> và <b>Ngón trỏ phải đến phím J</b> nhé!', 'normal');
          main.innerHTML = `
            <div class="screen-col">
              <div class="mission-head">
                <span class="mission-pill pill-emerald">NHIỆM VỤ 3 • BƯỚC 2/3</span>
                <h2 class="mission-title">👆 Đặt hai ngón trỏ đúng vị trí</h2>
              </div>

              <div class="token-row">
                <div id="tokLeft" data-token="l-index" class="btn-game finger-token f-l-index ${placedLeftIndex ? 'used' : ''}">
                  <span>👆</span><span>Ngón trỏ trái ${placedLeftIndex ? '(Đã đặt ✓)' : ''}</span>
                </div>
                <div id="tokRight" data-token="r-index" class="btn-game finger-token f-r-index ${placedRightIndex ? 'used' : ''}">
                  <span>👆</span><span>Ngón trỏ phải ${placedRightIndex ? '(Đã đặt ✓)' : ''}</span>
                </div>
              </div>

              <div class="home-row-zoom">
                <div class="home-row-zoom-title">HÀNG PHÍM CƠ SỞ</div>
                <div class="home-row-keys">
                  ${['A','S','D','F','G','H','J','K','L',';'].map(k => {
                    const isF = k === 'F';
                    const isJ = k === 'J';
                    const badge = (isF && placedLeftIndex) ? '<span class="mini-tag" style="background:#16a34a;">Trỏ trái</span>'
                                : (isJ && placedRightIndex) ? '<span class="mini-tag" style="background:#0284c7;">Trỏ phải</span>' : '';
                    return `
                      <div data-dropzone="${k}" class="kb-key zoom-key ${(isF && placedLeftIndex) ? 'f-l-index' : (isJ && placedRightIndex) ? 'f-r-index' : ''}">
                        <span>${k}</span>
                        ${badge}
                        ${(isF || isJ) ? '<span class="bump-bar"></span>' : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              ${renderHandsSVG({ highlightFinger: !placedLeftIndex ? 'l-index' : 'r-index' })}
            </div>
          `;

          const checkDrop = (tok, targetKey) => {
            if (tok === 'l-index' && targetKey === 'F') {
              placedLeftIndex = true;
              SoundFX.correct();
              setRobotSpeech('Chuẩn luôn! Ngón trỏ trái đặt lên phím <b>F</b>!', 'happy');
            } else if (tok === 'r-index' && targetKey === 'J') {
              placedRightIndex = true;
              SoundFX.correct();
              setRobotSpeech('Tuyệt vời! Ngón trỏ phải đặt lên phím <b>J</b>!', 'happy');
            } else {
              SoundFX.wrong();
              setRobotSpeech('Chưa đúng vị trí rồi! Nhớ đặt <b>Ngón trỏ trái ở F</b> và <b>Ngón trỏ phải ở J</b> (không đặt vào G hay H nhé)!', 'hint');
              return;
            }
            if (placedLeftIndex && placedRightIndex) {
              setTimeout(() => { step = 3; renderStep(); }, 900);
            } else {
              renderStep();
            }
          };

          const tL = document.getElementById('tokLeft');
          const tR = document.getElementById('tokRight');
          if (!placedLeftIndex) {
            makeDraggable(tL, 'l-index', checkDrop);
            tL.addEventListener('click', () => { selectedToken = 'l-index'; tL.classList.add('selected-ring'); tR.classList.remove('selected-ring'); });
          }
          if (!placedRightIndex) {
            makeDraggable(tR, 'r-index', checkDrop);
            tR.addEventListener('click', () => { selectedToken = 'r-index'; tR.classList.add('selected-ring'); tL.classList.remove('selected-ring'); });
          }
          main.querySelectorAll('[data-dropzone]').forEach(dz => {
            dz.addEventListener('click', () => {
              if (selectedToken) { checkDrop(selectedToken, dz.dataset.dropzone); selectedToken = null; }
            });
          });
        } else if (step === 3) {
          GameState.currentHintText = 'Hai gờ nhỏ trên phím F và J giúp tay em cảm nhận được vị trí đặt hai ngón trỏ mà không cần nhìn xuống bàn phím!';
          setRobotSpeech('Bước 3/3: Em hãy trả lời câu hỏi cuối để nhận Viên Pha lê Lục Bảo nhé!', 'normal');
          const options = [
            { id: 'A', text: 'A. Giúp xác định vị trí đặt hai ngón trỏ khi gõ bàn phím.' },
            { id: 'B', text: 'B. Giúp bật và tắt máy tính.' },
            { id: 'C', text: 'C. Giúp xóa kí tự.' }
          ];
          main.innerHTML = `
            <div class="screen-center">
              <div class="mission-head">
                <span class="mission-pill pill-emerald">NHIỆM VỤ 3 • BƯỚC 3/3</span>
                <h2 class="mission-title">❓ Vì sao hai phím F và J có gờ?</h2>
              </div>

              <div style="display:flex; gap:20px;">
                <div class="kb-key zoom-key f-l-index" style="font-size:24px;">F<span class="bump-bar"></span></div>
                <div class="kb-key zoom-key f-r-index" style="font-size:24px;">J<span class="bump-bar"></span></div>
              </div>

              <div class="quiz-box">
                ${options.map(o => `
                  <button data-opt="${o.id}" class="btn-game quiz-opt">${o.text}</button>
                `).join('')}
              </div>
            </div>
          `;

          main.querySelectorAll('[data-opt]').forEach(btn => {
            btn.addEventListener('click', () => {
              if (btn.dataset.opt === 'A') {
                btn.classList.add('opt-correct');
                awardMission(3);
                setRobotSpeech('🎉 Quá đỉnh! Em đã giải mã hoàn toàn bí mật phím F và J! Nhận <b>15 điểm</b> và Viên Pha lê Lục Bảo!', 'happy');
                setFooterAction(`
                  <button onclick="SoundFX.click(); goToScreen('m4')" class="btn-game btn-md btn-green">
                    Nhiệm vụ 4 ➜
                  </button>
                `);
              } else {
                SoundFX.wrong();
                btn.classList.add('opt-wrong');
                setRobotSpeech('Chưa đúng rồi! Em hãy nghĩ xem gờ nổi dưới đầu ngón tay giúp chúng ta nhận biết điều gì khi gõ phím nhé!', 'hint');
              }
            });
          });
        }
      }

      renderStep();
    }

    /*************************************************************************
     * 10. NHIỆM VỤ 4: ĐÔI BÀN TAY THẦN KỲ (15 ĐIỂM - 2 BÀI TẬP)
     *************************************************************************/
    function renderMission4() {
      let part = 1;
      const homeKeys = [
        { key: 'A', finger: 'l-pinky' },
        { key: 'S', finger: 'l-ring' },
        { key: 'D', finger: 'l-middle' },
        { key: 'F', finger: 'l-index' },
        { key: 'SPACE', finger: 'thumb' },
        { key: 'J', finger: 'r-index' },
        { key: 'K', finger: 'r-middle' },
        { key: 'L', finger: 'r-ring' },
        { key: ';', finger: 'r-pinky' }
      ];
      let p1Idx = 0;

      const p2Questions = [
        { key: 'D', answer: 'l-middle' },
        { key: 'K', answer: 'r-middle' },
        { key: 'A', answer: 'l-pinky' },
        { key: 'J', answer: 'r-index' }
      ];
      let p2Idx = 0;

      function renderPart() {
        const main = document.getElementById('mainContent');

        if (part === 1) {
          const cur = homeKeys[p1Idx];
          const targetLabel = cur.key === 'SPACE' ? 'Phím dấu cách (Space)' : `Phím ${cur.key}`;
          GameState.currentHintText = `Hãy nhìn màu sắc của ${targetLabel} và chọn đúng ngón tay cùng màu trên hình bàn tay (hoặc nút tên ngón tay) nhé!`;
          setRobotSpeech(`Bài tập 1/2 (${p1Idx + 1}/${homeKeys.length}): Ở vị trí xuất phát, ngón tay nào đặt lên <b>${targetLabel}</b>? Em hãy nháy vào ngón tay đó nhé!`, 'normal');

          main.innerHTML = `
            <div class="screen-col">
              <div class="mission-head">
                <span class="mission-pill pill-amber">NHIỆM VỤ 4 • BÀI TẬP 1/2 • 15 ĐIỂM</span>
                <h2 class="mission-title">🖐️ Đặt tay ở vị trí xuất phát</h2>
              </div>

              <div class="home-row-zoom" style="padding:10px;">
                <div class="home-row-keys">
                  ${homeKeys.map((hk, i) => {
                    const done = i < p1Idx;
                    const active = i === p1Idx;
                    const f = FINGERS[hk.finger];
                    return `
                      <div class="kb-key ${f.cls} ${active ? 'target-pulse' : ''}"
                        style="width:${hk.key === 'SPACE' ? '82px' : '46px'}; height:46px; font-size:14px; ${done ? 'opacity:0.65;' : ''}">
                        <span>${hk.key === 'SPACE' ? 'Space' : hk.key}</span>
                        ${done ? '<span style="font-size:10px; font-weight:900;">✓</span>' : ''}
                        ${(hk.key === 'F' || hk.key === 'J') ? '<span class="bump-bar"></span>' : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="hands-panel" style="border-color:#fde68a;">
                <div style="font-size:11px; font-weight:800; color:#64748b; margin-bottom:2px;">Nháy trực tiếp vào ngón tay trên hình hoặc chọn nút bên dưới:</div>
                ${renderHandsSVG({ clickable: true, showLabels: false })}
              </div>

              <div class="finger-btn-row">
                ${Object.values(FINGERS).map(f => `
                  <button data-finger-click="${f.id}" class="btn-game finger-btn ${f.cls}">${f.name}</button>
                `).join('')}
              </div>
            </div>
          `;

          main.querySelectorAll('[data-finger-click]').forEach(el => {
            el.addEventListener('click', () => {
              const chosen = el.dataset.fingerClick;
              if (chosen === cur.finger) {
                SoundFX.correct();
                p1Idx++;
                if (p1Idx >= homeKeys.length) {
                  setRobotSpeech('🎉 Tuyệt vời! Em đã thuộc vị trí xuất phát của cả hai bàn tay! Giờ sang Bài tập 2 nhé!', 'happy');
                  setTimeout(() => { part = 2; renderPart(); }, 1000);
                } else {
                  renderPart();
                }
              } else {
                SoundFX.wrong();
                setRobotSpeech(`Chưa đúng rồi! Hãy xem màu của <b>${targetLabel}</b> trùng với ngón tay màu nào nhé!`, 'hint');
              }
            });
          });
        } else {
          const q = p2Questions[p2Idx];
          GameState.currentHintText = `Phím ${q.key} có màu giống với ${FINGERS[q.answer].name} đấy!`;
          setRobotSpeech(`Bài tập 2/2 (Câu ${p2Idx + 1}/4): Em hãy chọn ngón tay dùng để gõ phím <b>${q.key}</b> nhé!`, 'normal');

          main.innerHTML = `
            <div class="screen-col">
              <div class="mission-head">
                <span class="mission-pill pill-amber">NHIỆM VỤ 4 • BÀI TẬP 2/2 (${p2Idx + 1}/4)</span>
                <h2 class="mission-title">
                  🎯 Hãy chọn ngón tay dùng để gõ phím
                  <span class="${FINGERS[q.answer].cls}" style="padding:2px 12px; border-radius:10px; border:2px solid; margin-left:4px;">${q.key}</span>
                </h2>
              </div>

              <div class="hands-panel">
                ${renderHandsSVG({ clickable: true, showLabels: false })}
              </div>

              <div class="finger-btn-grid">
                ${['l-pinky','l-ring','l-middle','l-index','r-index','r-middle','r-ring','r-pinky'].map(id => {
                  const f = FINGERS[id];
                  return `<button data-finger-click="${f.id}" class="btn-game finger-btn ${f.cls}">${f.name}</button>`;
                }).join('')}
              </div>
            </div>
          `;

          main.querySelectorAll('[data-finger-click]').forEach(el => {
            el.addEventListener('click', () => {
              if (el.dataset.fingerClick === q.answer) {
                SoundFX.correct();
                p2Idx++;
                if (p2Idx >= p2Questions.length) {
                  awardMission(4);
                  setRobotSpeech('🎉 Xuất sắc quá! Em đã làm chủ Đôi bàn tay thần kỳ! Nhận <b>15 điểm</b> và Viên Pha lê Hổ Phách!', 'happy');
                  setFooterAction(`
                    <button onclick="SoundFX.click(); goToScreen('m5')" class="btn-game btn-md btn-green">
                      Nhiệm vụ 5 ➜
                    </button>
                  `);
                } else {
                  setRobotSpeech(`Chính xác! Phím <b>${q.key}</b> do <b>${FINGERS[q.answer].name}</b> phụ trách!`, 'happy');
                  renderPart();
                }
              } else {
                SoundFX.wrong();
                setRobotSpeech(`Chưa đúng rồi! Em hãy nhìn lại màu sắc của phím <b>${q.key}</b> và đối chiếu với 10 ngón tay nhé!`, 'hint');
              }
            });
          });
        }
      }

      renderPart();
    }

    /*************************************************************************
     * 11. NHIỆM VỤ 5: THỬ THÁCH GÕ PHÍM (20 ĐIỂM - BÀN PHÍM THẬT!)
     *************************************************************************/
    function renderMission5() {
      const rounds = [
        { title: 'Vòng 1: Làm quen 4 phím giữa', seq: ['F','J','D','K'] },
        { title: 'Vòng 2: Luyện thêm 4 phím còn lại', seq: ['A','S','L',';'] },
        { title: 'Vòng 3: Gõ chuỗi phím liên tiếp', seq: ['F','J','F','J','A','S','D','F','J','K','L',';'] }
      ];
      let rIdx = 0;
      let kIdx = 0;
      let finished = false;

      function renderTypingUI(lastTyped = '', isWrong = false) {
        const curRound = rounds[rIdx];
        const targetChar = finished ? null : curRound.seq[kIdx];
        const targetFinger = targetChar ? KEY_TO_FINGER[targetChar] : null;

        GameState.currentHintText = targetChar
          ? `Hãy nhìn bàn phím thật của em, tìm phím "${targetChar}" và dùng ${FINGERS[targetFinger].name} để nhấn nhé!`
          : 'Em đã hoàn thành toàn bộ thử thách gõ phím!';

        if (!finished && !isWrong) {
          setRobotSpeech(`<b>${curRound.title}</b>: Em hãy đặt tay theo hình gợi ý và nhấn phím <b>"${targetChar}"</b> trên <b>bàn phím máy tính thật</b> nhé!`, 'normal');
        }

        const main = document.getElementById('mainContent');
        main.innerHTML = `
          <div class="screen-col">
            <div class="mission-head">
              <span class="mission-pill pill-pink">NHIỆM VỤ 5 • THỰC HÀNH BÀN PHÍM THẬT • 20 ĐIỂM</span>
              <h2 class="mission-title">⌨️ ${curRound.title} (Vòng ${rIdx + 1}/3)</h2>
            </div>

            <div class="seq-strip">
              ${curRound.seq.map((ch, idx) => {
                const isDone = finished || idx < kIdx;
                const isCur = !finished && idx === kIdx;
                const sep = (rIdx === 2 && (idx === 4 || idx === 8)) ? '<span class="seq-sep">|</span>' : '';
                return `${sep}<div class="seq-char ${isDone ? 'done' : isCur ? 'cur' : ''}">${ch}</div>`;
              }).join('')}
            </div>

            <div class="info-bar">
              <span class="info-pill-sky">🖐️ Em hãy tự quan sát và đặt đúng ngón tay theo hình gợi ý bên dưới nhé!</span>
              ${lastTyped ? `<span class="${isWrong ? 'info-pill-err' : 'info-pill-ok'}">Phím em vừa gõ: [ ${lastTyped} ]</span>` : ''}
            </div>

            <div class="typing-layout">
              <div style="display:flex; justify-content:center;">
                ${renderInteractiveMainKeyboard({ showBumps: true, colorByFinger: true, targetKey: targetChar })}
              </div>
              <div class="hands-panel" style="max-width:100%;">
                <div style="font-size:12px; font-weight:900; color:#4338ca; margin-bottom:4px;">
                  ${targetFinger ? `Gợi ý: Dùng ${FINGERS[targetFinger].name}` : 'Hoàn thành xuất sắc!'}
                </div>
                ${renderHandsSVG({ highlightFinger: targetFinger, showLabels: true })}
              </div>
            </div>
          </div>
        `;
      }

      GameState.activeKeyHandler = (e) => {
        if (finished) return;
        if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
        if (e.code === 'Space' || e.key === 'Enter') e.preventDefault();

        let typed = '';
        if (e.code === 'Semicolon' || e.key === ';') {
          typed = ';';
        } else if (e.key && e.key.length === 1) {
          typed = e.key.toUpperCase();
        } else {
          return;
        }

        const keyEl = document.querySelector(`[data-key="${typed === ';' ? '\\;' : typed}"]`);
        if (keyEl) {
          keyEl.classList.add('active-press');
          setTimeout(() => keyEl.classList.remove('active-press'), 180);
        }

        const expected = rounds[rIdx].seq[kIdx];
        if (typed === expected) {
          SoundFX.keyTap();
          kIdx++;
          if (kIdx >= rounds[rIdx].seq.length) {
            rIdx++;
            kIdx = 0;
            if (rIdx >= rounds.length) {
              finished = true;
              rIdx = rounds.length - 1;
              awardMission(5);
              renderTypingUI(typed, false);
              setRobotSpeech('🎉 Tuyệt đỉnh! Em đã gõ chính xác toàn bộ cả 3 vòng trên bàn phím thật! Nhận <b>20 điểm</b> và Viên Pha lê Hồng Ngọc!', 'happy');
              setFooterAction(`
                <button onclick="SoundFX.click(); goToScreen('m6')" class="btn-game btn-md btn-green">
                  Nhiệm vụ cuối (6) ➜
                </button>
              `);
              return;
            } else {
              SoundFX.correct();
              setRobotSpeech(`Hoàn thành xuất sắc Vòng ${rIdx}! Tiến sang Vòng ${rIdx + 1} nào!`, 'happy');
            }
          }
          renderTypingUI(typed, false);
        } else {
          SoundFX.wrong();
          renderTypingUI(typed, true);
          setRobotSpeech(`Em vừa nhấn phím <b>"${typed}"</b>. Hãy tìm và gõ đúng phím <b>"${expected}"</b> đang nhấp nháy nhé!`, 'hint');
        }
      };

      window.addEventListener('keydown', GameState.activeKeyHandler);
      renderTypingUI();
    }

    /*************************************************************************
     * 12. NHIỆM VỤ 6: BẬC THẦY BÀN PHÍM (30 ĐIỂM - 3 TÌNH HUỐNG x 10 ĐIỂM)
     *************************************************************************/
    function renderMission6() {
      let sit = 1;

      function renderSituation() {
        clearKeyboardListener();
        const main = document.getElementById('mainContent');

        const sitNav = `
          <div class="sit-nav">
            ${[1, 2, 3].map(n => `
              <button data-sit-nav="${n}" class="sit-btn ${sit === n ? 'active' : GameState.m6SubDone[n] ? 'done' : ''}">
                Tình huống ${n} ${GameState.m6SubDone[n] ? '✓' : '(10đ)'}
              </button>
            `).join('')}
          </div>
        `;

        if (sit === 1) {
          let fixedL = GameState.m6SubDone[1];
          let fixedR = GameState.m6SubDone[1];
          let selTok = null;

          const drawSit1 = () => {
            GameState.currentHintText = 'Hai ngón trỏ đang đặt sai ở G và H! Em hãy kéo Ngón trỏ trái về phím F và Ngón trỏ phải về phím J nhé!';
            setRobotSpeech('Tình huống 1 (10đ): Cách đặt hai ngón trỏ ở G và H như vậy đã đúng chưa? Em hãy <b>kéo hai ngón trỏ về đúng vị trí</b> nhé!', 'normal');

            main.innerHTML = `
              <div class="screen-col">
                <div class="mission-head">
                  <span class="mission-pill pill-rose">NHIỆM VỤ 6 • VẬN DỤNG CAO • 30 ĐIỂM</span>
                  <h2 class="mission-title">👑 Tình huống 1: Phát hiện và sửa lỗi đặt tay</h2>
                </div>
                ${sitNav}

                <div class="info-pill-warn">
                  ⚠️ Hiện tại: Ngón trỏ trái đang ở <b>G</b> (Sai), Ngón trỏ phải đang ở <b>H</b> (Sai). Hãy kéo chúng về đúng phím có gờ!
                </div>

                <div class="home-row-zoom">
                  <div class="home-row-keys">
                    ${['A','S','D','F','G','H','J','K','L',';'].map(k => {
                      const hasBadL = k === 'G' && !fixedL;
                      const hasBadR = k === 'H' && !fixedR;
                      const hasGoodL = k === 'F' && fixedL;
                      const hasGoodR = k === 'J' && fixedR;
                      const bgStyle = (hasBadL || hasBadR) ? 'background:#ffe4e6; border-color:#fb7185;' : '';
                      return `
                        <div data-dropzone="${k}" class="kb-key zoom-key-tall ${hasGoodL ? 'f-l-index' : hasGoodR ? 'f-r-index' : ''}" style="${bgStyle}">
                          <span>${k}</span>
                          ${(k === 'F' || k === 'J') ? '<span class="bump-bar"></span>' : ''}
                          ${hasBadL ? `<div id="badLeft" class="mini-tag" style="background:#10b981;">👆 Trỏ trái</div>` : ''}
                          ${hasBadR ? `<div id="badRight" class="mini-tag" style="background:#0ea5e9;">👆 Trỏ phải</div>` : ''}
                          ${hasGoodL ? `<span class="mini-tag" style="background:#16a34a;">✓ F</span>` : ''}
                          ${hasGoodR ? `<span class="mini-tag" style="background:#0284c7;">✓ J</span>` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div class="note-chip">Mẹo: Kéo nhãn <b>👆 Trỏ trái</b> và <b>👆 Trỏ phải</b> từ G, H sang đúng phím (hoặc nháy nhãn rồi nháy phím đích).</div>
              </div>
            `;

            bindSitNav();

            const checkFix = (tok, key) => {
              if (tok === 'L' && key === 'F') {
                fixedL = true;
                SoundFX.correct();
              } else if (tok === 'R' && key === 'J') {
                fixedR = true;
                SoundFX.correct();
              } else {
                SoundFX.wrong();
                setRobotSpeech('Chưa đúng rồi! Hai ngón trỏ phải đặt lên hai phím có gờ là <b>F</b> và <b>J</b> nhé!', 'hint');
                return;
              }
              if (fixedL && fixedR) {
                awardMission6Sub(1);
                setRobotSpeech('🎉 Chuẩn xác! Đã sửa lỗi đặt tay về <b>F</b> và <b>J</b>! Em nhận <b>10 điểm</b>. Sang Tình huống 2 nào!', 'happy');
                setFooterAction(`<button id="nextSitBtn" class="btn-game btn-md btn-green">Tình huống 2 ➜</button>`);
                document.getElementById('nextSitBtn').onclick = () => { SoundFX.click(); sit = 2; renderSituation(); };
              }
              drawSit1();
            };

            const bL = document.getElementById('badLeft');
            const bR = document.getElementById('badRight');
            if (bL) {
              makeDraggable(bL, 'L', checkFix);
              bL.addEventListener('click', (e) => { e.stopPropagation(); selTok = 'L'; bL.classList.add('selected-ring'); });
            }
            if (bR) {
              makeDraggable(bR, 'R', checkFix);
              bR.addEventListener('click', (e) => { e.stopPropagation(); selTok = 'R'; bR.classList.add('selected-ring'); });
            }
            main.querySelectorAll('[data-dropzone]').forEach(dz => {
              dz.addEventListener('click', () => {
                if (selTok) { checkFix(selTok, dz.dataset.dropzone); selTok = null; }
              });
            });
          };
          drawSit1();
        } else if (sit === 2) {
          const pairs = [
            { key: 'E', answer: 'l-middle' },
            { key: 'C', answer: 'l-middle' },
            { key: 'I', answer: 'r-middle' },
            { key: 'M', answer: 'r-index' }
          ];
          let phase = 'match';
          let idx = 0;

          const drawSit2 = () => {
            clearKeyboardListener();
            if (phase === 'match') {
              const cur = pairs[idx];
              GameState.currentHintText = `Phím ${cur.key} cùng cột màu với ${FINGERS[cur.answer].name} đấy!`;
              setRobotSpeech(`Tình huống 2 - Phần A (${idx + 1}/4): Ngón tay nào phụ trách gõ phím <b>${cur.key}</b>?`, 'normal');

              main.innerHTML = `
                <div class="screen-col">
                  <div class="mission-head">
                    <span class="mission-pill pill-rose">NHIỆM VỤ 6 • TÌNH HUỐNG 2/3 • 10 ĐIỂM</span>
                    <h2 class="mission-title">
                      🎯 Ngón tay nào phụ trách phím
                      <span class="${FINGERS[cur.answer].cls}" style="padding:2px 12px; border-radius:10px; border:2px solid;">${cur.key}</span> ?
                    </h2>
                  </div>
                  ${sitNav}

                  <div class="hands-panel">
                    ${renderHandsSVG({ clickable: true, showLabels: true })}
                  </div>

                  <div class="finger-btn-row">
                    ${['l-index','l-middle','r-index','r-middle','l-ring','r-ring'].map(id => {
                      const f = FINGERS[id];
                      return `<button data-finger-click="${f.id}" class="btn-game finger-btn ${f.cls}">${f.name}</button>`;
                    }).join('')}
                  </div>
                </div>
              `;
              bindSitNav();

              main.querySelectorAll('[data-finger-click]').forEach(el => {
                el.addEventListener('click', () => {
                  if (el.dataset.fingerClick === cur.answer) {
                    SoundFX.correct();
                    idx++;
                    if (idx >= pairs.length) {
                      phase = 'type';
                      idx = 0;
                      setRobotSpeech('Giỏi lắm! Bây giờ em hãy thực hành gõ chuỗi <b>E C I M</b> trên <b>bàn phím thật</b> nhé!', 'happy');
                    }
                    drawSit2();
                  } else {
                    SoundFX.wrong();
                    setRobotSpeech('Chưa đúng rồi! Hãy nhớ: <b>E, C</b> cùng cột với D (Ngón giữa trái), <b>I</b> cùng cột với K, <b>M</b> cùng cột với J!', 'hint');
                  }
                });
              });
            } else {
              const seq = ['E','C','I','M'];
              const target = idx < seq.length ? seq[idx] : null;
              GameState.currentHintText = target ? `Em hãy nhấn phím "${target}" trên bàn phím thật nhé!` : 'Em đã hoàn thành Tình huống 2!';

              main.innerHTML = `
                <div class="screen-col">
                  <div class="mission-head">
                    <span class="mission-pill pill-rose">NHIỆM VỤ 6 • TÌNH HUỐNG 2/3 • THỰC HÀNH GÕ</span>
                    <h2 class="mission-title">⌨️ Gõ chuỗi phím E C I M trên bàn phím thật</h2>
                  </div>
                  ${sitNav}

                  <div class="seq-strip">
                    ${seq.map((ch, i) => `
                      <div class="seq-char ${i < idx ? 'done' : i === idx ? 'cur' : ''}">${ch}</div>
                    `).join('')}
                  </div>

                  ${renderInteractiveMainKeyboard({ showBumps: true, colorByFinger: true, targetKey: target })}
                </div>
              `;
              bindSitNav();

              if (target) {
                GameState.activeKeyHandler = (e) => {
                  if (e.code === 'Space' || e.key === 'Enter') e.preventDefault();
                  if (!e.key || e.key.length !== 1) return;
                  const typed = e.key.toUpperCase();
                  if (typed === target) {
                    SoundFX.keyTap();
                    idx++;
                    if (idx >= seq.length) {
                      awardMission6Sub(2);
                      setRobotSpeech('🎉 Tuyệt vời! Em đã ghép đúng và gõ chuẩn chuỗi E C I M! Nhận thêm <b>10 điểm</b>!', 'happy');
                      setFooterAction(`<button id="nextSit3Btn" class="btn-game btn-md btn-green">Tình huống 3 ➜</button>`);
                      document.getElementById('nextSit3Btn').onclick = () => { SoundFX.click(); sit = 3; renderSituation(); };
                    }
                    drawSit2();
                  } else {
                    SoundFX.wrong();
                    setRobotSpeech(`Em vừa gõ "${typed}". Hãy gõ đúng phím <b>"${target}"</b> đang nhấp nháy nhé!`, 'hint');
                  }
                };
                window.addEventListener('keydown', GameState.activeKeyHandler);
              }
            }
          };
          drawSit2();
        } else {
          let answered = GameState.m6SubDone[3];
          GameState.currentHintText = 'Sau khi vươn ngón tay lên hàng trên hoặc xuống hàng dưới để gõ, ta luôn đưa ngón tay trở về vị trí xuất phát trên hàng phím cơ sở!';
          setRobotSpeech('Tình huống 3 (10đ): Một bạn nói: <i>"Sau khi gõ phím ở hàng trên hoặc hàng dưới, mình cứ để ngón tay ở đó để gõ tiếp."</i> Em hãy chọn cách sửa đúng nhé!', 'normal');

          const drawSit3 = () => {
            main.innerHTML = `
              <div class="screen-col">
                <div class="mission-head">
                  <span class="mission-pill pill-rose">NHIỆM VỤ 6 • TÌNH HUỐNG 3/3 • 10 ĐIỂM</span>
                  <h2 class="mission-title">🔄 Trở về vị trí xuất phát</h2>
                </div>
                ${sitNav}

                <div class="info-pill-quote">
                  💬 <b>Bạn nhỏ nói:</b> "Sau khi gõ phím ở hàng phím trên hoặc hàng phím dưới, mình cứ để ngón tay ở đó để gõ tiếp."
                </div>

                ${!answered ? `
                  <div class="quiz-box">
                    <button data-s3="A" class="btn-game quiz-opt">A. Sau khi gõ, đưa ngón tay về vị trí xuất phát trên hàng phím cơ sở.</button>
                    <button data-s3="B" class="btn-game quiz-opt">B. Sau khi gõ, chuyển tất cả ngón tay lên hàng phím số.</button>
                    <button data-s3="C" class="btn-game quiz-opt">C. Sau khi gõ, đặt hai ngón trỏ lên phím dấu cách.</button>
                  </div>
                ` : `
                  <div class="demo-return-card">
                    <div style="font-weight:900; color:#065f46; font-size:14px;">✨ Chính xác! Quan sát các ngón tay gõ E / M rồi tự động quay về hàng cơ sở:</div>
                    <div class="demo-mini-kb">
                      <div class="demo-mini-row">
                        <div class="kb-key demo-mini-key" style="opacity:0.6;">W</div>
                        <div class="kb-key demo-mini-key f-l-middle">E</div>
                        <div class="kb-key demo-mini-key" style="opacity:0.6;">R</div>
                        <div style="width:18px;"></div>
                        <div class="kb-key demo-mini-key" style="opacity:0.6;">U</div>
                        <div class="kb-key demo-mini-key f-r-middle">I</div>
                      </div>
                      <div class="demo-mini-row">
                        <div class="kb-key demo-mini-key f-l-ring">S</div>
                        <div class="kb-key demo-mini-key f-l-middle">
                          D
                          <div class="demo-dot demo-return-up" style="background:#facc15; border:2px solid #a16207;">👆</div>
                        </div>
                        <div class="kb-key demo-mini-key f-l-index">F<span class="bump-bar"></span></div>
                        <div style="width:18px;"></div>
                        <div class="kb-key demo-mini-key f-r-index">
                          J<span class="bump-bar"></span>
                          <div class="demo-dot demo-return-down" style="background:#38bdf8; border:2px solid #075985;">👆</div>
                        </div>
                        <div class="kb-key demo-mini-key f-r-middle">K</div>
                      </div>
                      <div class="demo-mini-row">
                        <div class="kb-key demo-mini-key" style="opacity:0.6;">X</div>
                        <div class="kb-key demo-mini-key f-l-middle">C</div>
                        <div class="kb-key demo-mini-key" style="opacity:0.6;">V</div>
                        <div style="width:18px;"></div>
                        <div class="kb-key demo-mini-key f-r-index">M</div>
                        <div class="kb-key demo-mini-key" style="opacity:0.6;">,</div>
                      </div>
                    </div>
                  </div>
                `}
              </div>
            `;
            bindSitNav();

            if (!answered) {
              main.querySelectorAll('[data-s3]').forEach(btn => {
                btn.addEventListener('click', () => {
                  if (btn.dataset.s3 === 'A') {
                    answered = true;
                    awardMission6Sub(3);
                    setRobotSpeech('🎉 Tuyệt vời! Luôn đưa ngón tay về hàng phím cơ sở sau khi gõ nhé! Em đã chinh phục Nhiệm vụ 6!', 'happy');
                    drawSit3();
                    setFooterAction(`
                      <button onclick="SoundFX.click(); goToScreen('treasure')" class="btn-game btn-md btn-grad-orange">
                        🏆 Mở Kho Báu ➜
                      </button>
                    `);
                  } else {
                    SoundFX.wrong();
                    btn.classList.add('opt-wrong');
                    setRobotSpeech('Chưa đúng rồi! Ngón tay luôn cần quay về "ngôi nhà" của nó trên hàng phím cơ sở đấy!', 'hint');
                  }
                });
              });
            } else {
              setFooterAction(`
                <button onclick="SoundFX.click(); goToScreen('treasure')" class="btn-game btn-md btn-grad-orange">
                  🏆 Mở Kho Báu ➜
                </button>
              `);
            }
          };
          drawSit3();
        }

        function bindSitNav() {
          main.querySelectorAll('[data-sit-nav]').forEach(b => {
            b.addEventListener('click', () => {
              SoundFX.click();
              sit = Number(b.dataset.sitNav);
              renderSituation();
            });
          });
        }
      }

      renderSituation();
    }

    /*************************************************************************
     * 13. MÀN HÌNH KHO BÁU & TỔNG KẾT (TREASURE)
     *************************************************************************/
    function renderTreasure() {
      const allDone = Object.values(GameState.completed).every(Boolean);
      const canOpen = allDone && GameState.score >= 80;
      const isMaster = canOpen && GameState.score === 100 && GameState.totalHintsUsed === 0;
      const selfBadges = MISSIONS_META.filter(m => GameState.completed[m.id] && !GameState.hintUsedByMission[m.id]).length;

      const main = document.getElementById('mainContent');

      if (canOpen) {
        SoundFX.victory();
        startConfetti();
        const titleEarned = isMaster ? 'BẬC THẦY BÀN PHÍM' : 'HIỆP SĨ BÀN PHÍM';
        setRobotSpeech(`🎊 Chúc mừng ${titleEarned}! Sáu viên pha lê đã tỏa sáng và giải cứu thành công Vương quốc Bàn phím!`, 'happy');
        GameState.currentHintText = 'Em đã hoàn thành xuất sắc trò chơi! Em có thể nhấn "Chơi lại" để luyện tập thêm nhé!';

        main.innerHTML = `
          <div class="screen-center" style="text-align:center;">
            <div class="treasure-crystals">
              ${MISSIONS_META.map(m => `
                <div class="treasure-crystal-orb">${renderCrystalSVG(m.color, true)}</div>
              `).join('')}
            </div>

            <div style="font-size:62px; line-height:1;">🏆</div>

            <div>
              <div class="home-badge" style="margin-bottom:4px;">KHO BÁU ĐÃ MỞ! • ĐIỂM SỐ: ${GameState.score} / 100</div>
              <h2 class="home-title" style="font-size:28px; background:linear-gradient(90deg,#f59e0b,#ea580c,#e11d48); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
                DANH HIỆU: ${titleEarned}
              </h2>
            </div>

            <div class="info-bar">
              ${selfBadges > 0 ? `<span class="info-pill-sky" style="background:#e0e7ff; color:#3730a3; border-color:#a5b4fc;">🏅 Huy hiệu "Tự mình chinh phục" (${selfBadges}/6 nhiệm vụ không dùng gợi ý)</span>` : ''}
              ${isMaster ? `<span class="info-pill-sky" style="background:#fef9c3; color:#854d0e; border-color:#facc15;">👑 Hoàn hảo 100/100 điểm – Không cần gợi ý!</span>` : ''}
            </div>

            <div class="home-actions">
              <button onclick="SoundFX.click(); goToScreen('home')" class="btn-game btn-md btn-sky">🏠 Về Trang chủ</button>
              <button onclick="SoundFX.click(); confirmRestart()" class="btn-game btn-md btn-green">🔄 Chơi lại từ đầu</button>
            </div>
          </div>
        `;
      } else {
        setRobotSpeech('Em đang làm rất tốt! Hãy hoàn thành nốt các thử thách bên dưới để đủ 6 viên pha lê và đạt ít nhất 80 điểm mở kho báu nhé!', 'normal');
        GameState.currentHintText = 'Nháy vào nút "Luyện tập" bên cạnh nhiệm vụ chưa hoàn thành để thu thập thêm pha lê và điểm số!';

        main.innerHTML = `
          <div class="screen-center" style="text-align:center;">
            <div style="font-size:48px; line-height:1;">🔒</div>
            <div>
              <h2 class="mission-title">Rương Kho Báu Đang Chờ Em!</h2>
              <p class="home-sub">
                Điểm hiện tại: <b style="color:#4f46e5;">${GameState.score}/100</b> • Cần hoàn thành đủ <b>6 nhiệm vụ</b> và đạt từ <b>80 điểm</b> trở lên.
              </p>
            </div>

            <div class="treasure-grid">
              ${MISSIONS_META.map(m => {
                const done = GameState.completed[m.id];
                return `
                  <div class="treasure-item ${done ? 'done' : ''}">
                    <div>
                      <div style="font-weight:900; font-size:13px; color:#1e293b;">${m.icon} ${m.id}. ${m.title}</div>
                      <div style="font-size:11px; font-weight:700; color:${done ? '#059669' : '#d97706'};">${done ? 'Đã hoàn thành ✓' : 'Chưa hoàn thành'}</div>
                    </div>
                    ${!done ? `
                      <button onclick="SoundFX.click(); goToScreen('m${m.id}')" class="btn-game btn-sm btn-amber">Luyện tập</button>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }
    }

    /*************************************************************************
     * 14. HIỆU ỨNG PHÁO GIẤY (CANVAS NHẸ CHO MÁY CẤU HÌNH THẤP)
     *************************************************************************/
    let confettiAnimId = null;
    function startConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const stage = document.getElementById('gameStage');
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
      const ctx = canvas.getContext('2d');
      const colors = ['#38bdf8', '#a855f7', '#22c55e', '#facc15', '#fb7185', '#f97316'];
      const pieces = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: 8 + Math.random() * 6,
        h: 5 + Math.random() * 5,
        c: colors[Math.floor(Math.random() * colors.length)],
        vy: 2 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 1.5,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 6
      }));

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          p.rot += p.vrot;
          if (p.y > canvas.height + 20) {
            p.y = -15;
            p.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        confettiAnimId = requestAnimationFrame(loop);
      }
      stopConfetti();
      loop();
    }

    function stopConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      const canvas = document.getElementById('confettiCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /*************************************************************************
     * 15. CÁC NÚT ĐIỀU KHIỂN HEADER
     *************************************************************************/
    function confirmRestart() {
      showModal({
        icon: '🔄',
        title: 'Chơi lại từ đầu?',
        body: 'Điểm số và 6 viên pha lê sẽ được đặt lại về 0 để em chinh phục lại từ đầu nhé!',
        buttons: [
          { label: 'Để sau', cls: 'btn-slate' },
          {
            label: 'Chơi lại ngay',
            cls: 'btn-rose-dk',
            onClick: () => {
              GameState.score = 0;
              GameState.completed = { 1: false, 2: false, 3: false, 4: false, 5: false, 6: false };
              GameState.m6SubDone = { 1: false, 2: false, 3: false, 4: false };
              GameState.m6SubDone = { 1: false, 2: false, 3: false };
              GameState.hintUsedByMission = { 1: false, 2: false, 3: false, 4: false, 5: false, 6: false };
              GameState.totalHintsUsed = 0;
              goToScreen('home');
            }
          }
        ]
      });
    }

    document.getElementById('btnHome').addEventListener('click', () => {
      SoundFX.click();
      goToScreen('home');
    });

    document.getElementById('btnTreasureNav').addEventListener('click', () => {
      SoundFX.click();
      goToScreen('treasure');
    });

    document.getElementById('btnSound').addEventListener('click', (e) => {
      SoundFX.enabled = !SoundFX.enabled;
      e.currentTarget.textContent = SoundFX.enabled ? '🔊' : '🔇';
      if (SoundFX.enabled) SoundFX.click();
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
      SoundFX.click();
      confirmRestart();
    });

    document.getElementById('btnHint').addEventListener('click', () => {
      SoundFX.click();
      if (GameState.screen.startsWith('m')) {
        const mNum = Number(GameState.screen.slice(1));
        if (!GameState.completed[mNum]) {
          GameState.hintUsedByMission[mNum] = true;
          GameState.totalHintsUsed++;
        }
      }
      showModal({
        icon: '💡',
        title: 'Gợi ý từ Rô-bốt Bàn Phím',
        body: GameState.currentHintText,
        buttons: [{ label: 'Em hiểu rồi!', cls: 'btn-sky' }]
      });
    });

    window.addEventListener('load', () => {
      goToScreen('home');
    });
  </script>
